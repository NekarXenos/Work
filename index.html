<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerhard Oosthuizen | Studio Archive</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="gallery-shell">
    <section class="stage" aria-label="Gerhard Oosthuizen studio archive">
      <div class="studio">
        <header class="masthead">
          <p class="eyebrow"><span class="brush">· Artist · Vehicle Wrap Designer ·</span></p>
          <h1>Gerhard Oosthuizen</h1>
          <p class="instruction">
            <span class="instruction-hover brush">Hover over a canvas or monitor and scroll to browse</span>
            <span class="instruction-touch brush">Tap a canvas or monitor to view, swipe to browse</span>
          </p>
        </header>

        <h2 class="section-heading section-heading--art"><span class="brush">Art</span></h2>
        <h2 class="section-heading section-heading--design"><span class="brush">Vehicle Wrap<br> and Design</span></h2>

        <div class="hotspot-layer" aria-label="Interactive studio works">
          <button class="hotspot canvas-slot" data-gallery="art" data-slot="canvas-1" aria-label="Browse artwork one">
            <img alt="Artwork one" draggable="false">
            <span class="slot-label">01 / art</span>
          </button>
          <button class="hotspot canvas-slot" data-gallery="art" data-slot="canvas-2" aria-label="Browse artwork two">
            <img alt="Artwork two" draggable="false">
            <span class="slot-label">02 / art</span>
          </button>
          <button class="hotspot canvas-slot" data-gallery="art" data-slot="canvas-3" aria-label="Browse artwork three">
            <img alt="Artwork three" draggable="false">
            <span class="slot-label">03 / art</span>
          </button>
          <button class="hotspot canvas-slot" data-gallery="art" data-slot="canvas-4" aria-label="Browse artwork four">
            <img alt="Artwork four" draggable="false">
            <span class="slot-label">04 / art</span>
          </button>
          <button class="hotspot canvas-slot" data-gallery="art" data-slot="canvas-5" aria-label="Browse artwork five">
            <img alt="Artwork five" draggable="false">
            <span class="slot-label">05 / art</span>
          </button>

          <button class="hotspot monitor-slot" data-gallery="design" data-slot="monitor-1" aria-label="Browse design work one">
            <img alt="Design work one" draggable="false">
            <span class="slot-label">01 / design</span>
          </button>
          <button class="hotspot monitor-slot" data-gallery="design" data-slot="monitor-2" aria-label="Browse design work two">
            <img alt="Design work two" draggable="false">
            <span class="slot-label">02 / design</span>
          </button>
          <button class="hotspot monitor-slot" data-gallery="design" data-slot="monitor-3" aria-label="Browse design work three">
            <img alt="Design work three" draggable="false">
            <span class="slot-label">03 / design</span>
          </button>
          <button class="hotspot monitor-slot" data-gallery="design" data-slot="monitor-4" aria-label="Browse design work four">
            <img alt="Design work four" draggable="false">
            <span class="slot-label">04 / design</span>
          </button>
          <button class="hotspot monitor-slot" data-gallery="design" data-slot="monitor-5" aria-label="Browse design work five">
            <img alt="Design work five" draggable="false">
            <span class="slot-label">05 / design</span>
          </button>
        </div>

        <nav class="drawer-links" aria-label="Contact and other work">
          <a class="drawer-link drawer-link--email" href="mailto:nekarx@gmail.com" aria-label="Email Gerhard at nekarx@gmail.com">
            <span class="brush"><span class="email-full">nekarx@gmail.com</span><span class="email-short">Email</span></span>
          </a>
          <a class="drawer-link drawer-link--experiments" href="Xeno_Plaza.html" aria-label="3D Experiments"><span class="brush"><span class="experiments-full">3D Experiments</span><span class="experiments-short">3D Work</span></span></a>
        </nav>
      </div>

      <footer class="footer-note">
        <span class="brush">Pretoria, South Africa</span>
        <span class="brush">Archive / 2026</span>
      </footer>
    </section>
  </main>

  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Expanded artwork" hidden>
    <button class="close-button" type="button" aria-label="Close expanded artwork">×</button>
    <button class="lightbox-nav lightbox-nav--previous" type="button" aria-label="Previous artwork"></button>
    <button class="lightbox-nav lightbox-nav--next" type="button" aria-label="Next artwork"></button>
    <figure class="lightbox-figure">
      <img alt="Expanded artwork" draggable="false">
      <figcaption></figcaption>
    </figure>
  </div>

  <script src="script.js"></script>
</body>
</html>
